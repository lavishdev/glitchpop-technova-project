server:
  port: 8080

spring:
  application:
    name: CrowdShieldBackend
  datasource:
    url: jdbc:h2:mem:crowdshielddb
    driverClassName: org.h2.Driver
    username: sa
    password: password
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console

jwt:
  secret: aVeryLongSecretKeyForCrowdShieldBackendThatShouldBeAtLeast256BitsLongForHS256Algorithm
  expiration: 86400000 # 24 hours

logging:
  level:
    org.springframework.web: INFO
    org.springframework.security: INFO
    com.crowdshield: DEBUG
