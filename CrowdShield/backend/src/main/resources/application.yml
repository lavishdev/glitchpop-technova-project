server:
  port: 8080

spring:
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB
  application:
    name: CrowdShieldBackend
  datasource:
    url: jdbc:h2:mem:crowdshielddb;DB_CLOSE_DELAY=-1
    driverClassName: org.h2.Driver
    username: sa
    password: password
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console

jwt:
  secret: aVeryLongSecretKeyForCrowdShieldBackendThatShouldBeAtLeast256BitsLongForHS256Algorithm
  expiration: 86400000 # 24 hours

logging:
  level:
    org.springframework.web: INFO
    org.springframework.security: INFO
    com.crowdshield: DEBUG

crowd:
  maxDensity: 300
  criticalDensity: 250
  fireThreshold: 0.8
  violenceThreshold: 0.75
  smokeThreshold: 0.85

simulator:
  enabled: true

notification:
  enabled: true

ai:
  service:
    public:
      url: http://127.0.0.1:8000
